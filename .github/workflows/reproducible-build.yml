name: Reproducible Build

# Two-layer determinism check for the StellarCred contract WASM artifacts.
#
# Both layers use the same rustup-installed toolchain (pinned via
# rust-toolchain.toml) to compile the WASM.  The Docker image is used only as
# a pre-populated Cargo registry cache — it never runs the compiler.
#
# Layer 1 — build A vs build B (same toolchain, fresh cargo home each time)
#   Catches compiler nondeterminism: timestamp embedding, ASLR in codegen,
#   non-deterministic symbol ordering from LTO.
#
# Layer 2 — build A vs build C (same source, cargo home from Docker cache)
#   Build C uses the Cargo registry pre-fetched inside the Docker image rather
#   than the one downloaded during build A.  A pass here means the registry
#   cache location does not affect output — the reproducibility claim that
#   lets a third party verify from a fresh checkout.
#
# All three builds use SOURCE_DATE_EPOCH=0 and identical RUSTFLAGS path
# remaps so embedded paths are normalised to canonical values.

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/Dockerfile.reproducible'
      - '.github/workflows/reproducible-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/Dockerfile.reproducible'
      - '.github/workflows/reproducible-build.yml'

permissions:
  contents: read

jobs:
  reproducible-build:
    name: Build three times with different cargo homes, compare all three
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ── Install pinned Rust toolchain ─────────────────────────────────────
      - name: Install pinned Rust toolchain
        run: |
          CHANNEL=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "Pinned channel: $CHANNEL"
          rustup toolchain install "$CHANNEL" --target wasm32v1-none --no-self-update
          rustup default "$CHANNEL"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      # ── Set reproducible build environment ───────────────────────────────
      # SOURCE_DATE_EPOCH=0 strips timestamps. RUSTFLAGS normalises any
      # absolute paths the compiler embeds in WASM metadata.
      - name: Set reproducible build environment
        run: |
          {
            echo "SOURCE_DATE_EPOCH=0"
            echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/workspace --remap-path-prefix=${HOME}/.cargo=/usr/local/cargo --remap-path-prefix=${HOME}/.rustup=/usr/local/rustup"
          } >> "$GITHUB_ENV"

      # ── Build the Docker image (for registry cache only) ─────────────────
      # The image pre-fetches all Cargo dependencies so build C can run
      # --offline with a different CARGO_HOME.  The image does NOT compile
      # the contracts — the host rustup toolchain does all three builds.
      - name: Build Docker image (registry cache)
        run: |
          docker build \
            --no-cache \
            -f docker/Dockerfile.reproducible \
            -t stellarcred-build:ci \
            .

      # Extract the pre-fetched Cargo registry from the image to a host dir.
      - name: Extract Cargo registry from Docker image
        run: |
          docker create --name cargo-cache stellarcred-build:ci
          mkdir -p /tmp/docker-cargo-home
          docker cp cargo-cache:/usr/local/cargo/registry /tmp/docker-cargo-home/registry 2>/dev/null || true
          docker cp cargo-cache:/root/.cargo/registry     /tmp/docker-cargo-home/registry 2>/dev/null || true
          docker rm cargo-cache

      # ── Build A: standard host build ─────────────────────────────────────
      - name: "Build A: host with normal cargo home"
        run: |
          mkdir -p build-a
          cargo build --release --target wasm32v1-none --locked
          cp target/wasm32v1-none/release/credential_verifier.wasm \
             target/wasm32v1-none/release/issuer_registry.wasm \
             target/wasm32v1-none/release/proof_registry.wasm \
             target/wasm32v1-none/release/gated_pool.wasm \
             build-a/
          sha256sum build-a/*.wasm | tee build-a/sha256sums.txt

      # ── Build B: second independent host build ───────────────────────────
      - name: "Build B: host with fresh cargo target dir"
        run: |
          mkdir -p build-b
          cargo build --release --target wasm32v1-none --locked \
            --target-dir /tmp/build-b-target
          cp /tmp/build-b-target/wasm32v1-none/release/credential_verifier.wasm \
             /tmp/build-b-target/wasm32v1-none/release/issuer_registry.wasm \
             /tmp/build-b-target/wasm32v1-none/release/proof_registry.wasm \
             /tmp/build-b-target/wasm32v1-none/release/gated_pool.wasm \
             build-b/
          sha256sum build-b/*.wasm | tee build-b/sha256sums.txt

      # ── Build C: host build using Docker image's registry cache ──────────
      - name: "Build C: host with Docker registry cache"
        run: |
          mkdir -p build-c /tmp/docker-cargo-home/bin
          # Point CARGO_HOME at the extracted Docker registry so this build
          # uses a different cache location than builds A and B.
          cp -r "$HOME/.cargo/bin" /tmp/docker-cargo-home/bin 2>/dev/null || true
          CARGO_HOME=/tmp/docker-cargo-home \
          cargo build --release --target wasm32v1-none --locked --offline \
            --target-dir /tmp/build-c-target
          cp /tmp/build-c-target/wasm32v1-none/release/credential_verifier.wasm \
             /tmp/build-c-target/wasm32v1-none/release/issuer_registry.wasm \
             /tmp/build-c-target/wasm32v1-none/release/proof_registry.wasm \
             /tmp/build-c-target/wasm32v1-none/release/gated_pool.wasm \
             build-c/
          sha256sum build-c/*.wasm | tee build-c/sha256sums.txt

      # ── Layer 1: A vs B (same environment, different target dir) ─────────
      - name: "Layer 1: compare build A vs build B"
        run: |
          echo "--- Layer 1: build A vs build B ---"
          echo "Build A:"; cat build-a/sha256sums.txt
          echo "Build B:"; cat build-b/sha256sums.txt
          if diff \
               <(awk '{print $1}' build-a/sha256sums.txt | sort) \
               <(awk '{print $1}' build-b/sha256sums.txt | sort); then
            echo "✓ Layer 1 passed: builds A and B are byte-identical."
          else
            echo "✗ Layer 1 FAILED: builds differ — compiler is nondeterministic."
            exit 1
          fi

      # ── Layer 2: A vs C (different cargo home / registry source) ─────────
      - name: "Layer 2: compare build A vs build C (Docker registry cache)"
        run: |
          echo "--- Layer 2: build A vs build C ---"
          echo "Build A:"; cat build-a/sha256sums.txt
          echo "Build C:"; cat build-c/sha256sums.txt
          if diff \
               <(awk '{print $1}' build-a/sha256sums.txt | sort) \
               <(awk '{print $1}' build-c/sha256sums.txt | sort); then
            echo "✓ Layer 2 passed: builds A and C are byte-identical."
            echo "  Registry cache location does not affect output."
          else
            echo "✗ Layer 2 FAILED: builds A and C differ."
            echo "  The Cargo registry source affects build output — not reproducible."
            exit 1
          fi

      # ── Canonical hash manifest ───────────────────────────────────────────
      - name: Produce canonical hash manifest
        run: |
          {
            echo "# StellarCred WASM SHA-256 hashes"
            echo "# Commit:    ${{ github.sha }}"
            echo "# Ref:       ${{ github.ref }}"
            echo "# Workflow:  ${{ github.run_id }}"
            echo "# Toolchain: $(rustc --version)"
            echo "# Verified:  3 independent builds (2 target dirs + Docker registry cache)"
            echo "#"
            awk '{print $1, $2}' build-a/sha256sums.txt
          } > canonical-hashes.txt
          cat canonical-hashes.txt

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-artifacts-${{ github.sha }}
          path: build-a/*.wasm
          retention-days: 30

      - name: Upload canonical hash manifest
        uses: actions/upload-artifact@v7
        with:
          name: wasm-hashes-${{ github.sha }}
          path: canonical-hashes.txt
          retention-days: 90
