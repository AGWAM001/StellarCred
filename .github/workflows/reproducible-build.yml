name: Reproducible Build

# Two-layer determinism check for the StellarCred contract WASM artifacts.
#
# Layer 1 — within-environment (container vs container)
#   Two independent `docker run` invocations both use the pinned container
#   image. Catches nondeterminism inside the compiler: timestamp embedding,
#   ASLR in codegen, non-deterministic symbol ordering from LTO.
#
# Layer 2 — cross-environment (host vs container)
#   The runner's own Rust toolchain (pinned via rust-toolchain.toml) builds
#   the WASM directly on the host, and its hashes are compared against the
#   container output. A pass here means an independent third party with a
#   fresh toolchain install reproduces the same bytes — the trust claim
#   from #427.
#
# Path normalisation: both environments set the same RUSTFLAGS remaps so
# any absolute path the compiler embeds in WASM metadata is normalised to
# the container-canonical values (/workspace, /usr/local/cargo,
# /usr/local/rustup) before the compiler sees them.

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/Dockerfile.reproducible'
      - '.github/workflows/reproducible-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/Dockerfile.reproducible'
      - '.github/workflows/reproducible-build.yml'

permissions:
  contents: read

jobs:
  reproducible-build:
    name: Build twice (container) + once (host), compare all three
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ── Install pinned Rust toolchain on the host ─────────────────────────
      # Parse the channel from rust-toolchain.toml, install it explicitly,
      # and make it the default so cargo build below uses exactly the same
      # version as the Docker base image. Prepend ~/.cargo/bin to PATH so the
      # runner's pre-installed system Rust cannot shadow rustup's shims.
      - name: Install pinned Rust toolchain (host)
        run: |
          CHANNEL=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "Pinned channel: $CHANNEL"
          rustup toolchain install "$CHANNEL" --target wasm32v1-none --no-self-update
          rustup default "$CHANNEL"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      # ── Set reproducible build environment (shared by host and container) ─
      # SOURCE_DATE_EPOCH=0  — strips any timestamp the compiler injects.
      # RUSTFLAGS remaps     — normalise all absolute paths the compiler may
      #   embed in WASM metadata (source tree, Cargo registry, rustup sysroot)
      #   to the container-canonical values so host and container artifacts are
      #   path-identical before hashing.
      #
      # Path remapping strategy:
      #   Host path                           → Canonical (container) path
      #   ${{ github.workspace }}             → /workspace
      #   $CARGO_HOME  (default ~/.cargo)     → /usr/local/cargo
      #   $RUSTUP_HOME (default ~/.rustup)    → /usr/local/rustup
      #
      # We resolve CARGO_HOME and RUSTUP_HOME at shell time so the remaps
      # cover non-default locations (e.g. when a prior CI step sets them).
      # The Actions expression ${{ github.workspace }} is used for the source
      # tree remap to guarantee the exact runner checkout path is covered even
      # if $GITHUB_WORKSPACE is shadowed or empty.
      - name: Set reproducible build environment
        run: |
          CARGO_HOME_RESOLVED="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_HOME_RESOLVED="${RUSTUP_HOME:-$HOME/.rustup}"

          # Build RUSTFLAGS one remap at a time to avoid long-line truncation
          # and make future additions easy to review.
          RUSTFLAGS_VALUE="--remap-path-prefix=${{ github.workspace }}=/workspace"
          RUSTFLAGS_VALUE="$RUSTFLAGS_VALUE --remap-path-prefix=${CARGO_HOME_RESOLVED}=/usr/local/cargo"
          RUSTFLAGS_VALUE="$RUSTFLAGS_VALUE --remap-path-prefix=${RUSTUP_HOME_RESOLVED}=/usr/local/rustup"

          {
            echo "SOURCE_DATE_EPOCH=0"
            echo "RUSTFLAGS=$RUSTFLAGS_VALUE"
          } >> "$GITHUB_ENV"

          # Verify the complete value before the expensive build steps.
          echo "=== Debug: Resolved RUSTFLAGS ===" >&2
          echo "$RUSTFLAGS_VALUE" >&2

      - name: Validate RUSTFLAGS (catch truncation before builds)
        run: |
          if ! echo "$RUSTFLAGS" | grep -q "remap-path-prefix=.*cargo"; then
            echo "✗ FATAL: RUSTFLAGS is missing the cargo remap — possible truncation"
            echo "Got: $RUSTFLAGS"
            exit 1
          fi
          if ! echo "$RUSTFLAGS" | grep -q "remap-path-prefix=.*rustup"; then
            echo "✗ FATAL: RUSTFLAGS is missing the rustup remap — possible truncation"
            echo "Got: $RUSTFLAGS"
            exit 1
          fi
          echo "✓ RUSTFLAGS validation passed"
          echo "RUSTFLAGS=$RUSTFLAGS"

      # ── Build the Docker image ────────────────────────────────────────────
      # --no-cache ensures we always compile from the current commit's source,
      # not a cached layer that may have baked in older contract source code.
      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -f docker/Dockerfile.reproducible \
            -t stellarcred-build:ci \
            .

      # ── Hard gate: compiler versions must match ───────────────────────────
      # If rust-toolchain.toml and the Dockerfile diverge this step fails
      # loudly before we waste time building and comparing artifacts.
      - name: Verify host and container toolchains match
        run: |
          host_version="$(rustc --version)"
          container_version="$(docker run --rm stellarcred-build:ci rustc --version)"
          echo "Host:      $host_version"
          echo "Container: $container_version"
          if [ "$host_version" != "$container_version" ]; then
            echo "✗ Toolchain mismatch — update rust-toolchain.toml or docker/Dockerfile.reproducible so both pin the same version."
            exit 1
          fi
          echo "✓ Toolchains match."

      # ── Host build ────────────────────────────────────────────────────────
      # SOURCE_DATE_EPOCH and RUSTFLAGS are set via GITHUB_ENV above and
      # validated by the preceding step.
      # CARGO_TARGET_DIR is set to a path outside the workspace so the host's
      # incremental cache is never visible inside the bind-mounted /workspace
      # when the container runs. Without this, the container would find and
      # reuse the host's compiled artifacts, silently producing host-built
      # WASM rather than an independent container build.
      - name: Build WASM on host
        run: |
          mkdir -p build-host
          CARGO_TARGET_DIR="${{ github.workspace }}/target-host" \
          cargo build \
            --release \
            --target wasm32v1-none \
            --locked
          cp "${{ github.workspace }}/target-host/wasm32v1-none/release/credential_verifier.wasm" \
             "${{ github.workspace }}/target-host/wasm32v1-none/release/issuer_registry.wasm" \
             "${{ github.workspace }}/target-host/wasm32v1-none/release/proof_registry.wasm" \
             "${{ github.workspace }}/target-host/wasm32v1-none/release/gated_pool.wasm" \
             build-host/

      - name: Hash host artifacts
        run: |
          echo "=== Host SHA-256 hashes ==="
          sha256sum build-host/*.wasm | tee build-host/sha256sums.txt

      # ── Container build 1 ─────────────────────────────────────────────────
      # Mount the live workspace as /workspace (overrides the baked-in source)
      # so container and host compile the identical current checkout.
      # The container gets a fresh CARGO_TARGET_DIR (/tmp/target inside the
      # container) so it never touches or reuses any host-built artifacts that
      # may exist in the workspace mount.
      - name: Build WASM (container run 1)
        run: |
          mkdir -p build-1
          cat > /tmp/container-build.sh << 'SCRIPT'
          set -e
          export CARGO_TARGET_DIR=/tmp/target
          rm -rf "$CARGO_TARGET_DIR"
          cargo build --release --target wasm32v1-none --locked --offline
          cp "$CARGO_TARGET_DIR/wasm32v1-none/release/credential_verifier.wasm" \
             "$CARGO_TARGET_DIR/wasm32v1-none/release/issuer_registry.wasm" \
             "$CARGO_TARGET_DIR/wasm32v1-none/release/proof_registry.wasm" \
             "$CARGO_TARGET_DIR/wasm32v1-none/release/gated_pool.wasm" \
             /out/
          SCRIPT
          chmod +x /tmp/container-build.sh
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/build-1:/out" \
            -v "/tmp/container-build.sh:/container-build.sh:ro" \
            -e SOURCE_DATE_EPOCH=0 \
            -e "RUSTFLAGS=--remap-path-prefix=/workspace=/workspace --remap-path-prefix=/usr/local/cargo=/usr/local/cargo --remap-path-prefix=/usr/local/rustup=/usr/local/rustup" \
            stellarcred-build:ci \
            sh /container-build.sh

      - name: Hash container run-1 artifacts
        run: |
          echo "=== Container run 1 SHA-256 hashes ==="
          sha256sum build-1/*.wasm | tee build-1/sha256sums.txt

      # ── Container build 2 ─────────────────────────────────────────────────
      # Reuses the same bind-mounted script. Each run gets a fresh
      # CARGO_TARGET_DIR (/tmp/target) inside the container so the two runs
      # are fully independent of each other and of the host build.
      - name: Build WASM (container run 2)
        run: |
          mkdir -p build-2
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/build-2:/out" \
            -v "/tmp/container-build.sh:/container-build.sh:ro" \
            -e SOURCE_DATE_EPOCH=0 \
            -e "RUSTFLAGS=--remap-path-prefix=/workspace=/workspace --remap-path-prefix=/usr/local/cargo=/usr/local/cargo --remap-path-prefix=/usr/local/rustup=/usr/local/rustup" \
            stellarcred-build:ci \
            sh /container-build.sh

      - name: Hash container run-2 artifacts
        run: |
          echo "=== Container run 2 SHA-256 hashes ==="
          sha256sum build-2/*.wasm | tee build-2/sha256sums.txt

      # ── Layer 1: within-environment (container vs container) ──────────────
      - name: "Layer 1: compare container run 1 vs container run 2"
        run: |
          echo "--- Layer 1: container vs container ---"
          if diff \
               <(awk '{print $1}' build-1/sha256sums.txt | sort) \
               <(awk '{print $1}' build-2/sha256sums.txt | sort); then
            echo "✓ Layer 1 passed: both container builds are byte-identical."
          else
            echo "✗ Layer 1 FAILED: container builds differ — compiler is nondeterministic."
            echo "build-1:"; cat build-1/sha256sums.txt
            echo "build-2:"; cat build-2/sha256sums.txt
            exit 1
          fi

      # ── Layer 2: cross-environment (host vs container) ────────────────────
      - name: "Layer 2: compare host build vs container build"
        run: |
          echo "--- Layer 2: host vs container ---"
          echo "Host hashes:"
          cat build-host/sha256sums.txt
          echo "Container hashes:"
          cat build-1/sha256sums.txt
          if diff \
               <(awk '{print $1}' build-host/sha256sums.txt | sort) \
               <(awk '{print $1}' build-1/sha256sums.txt   | sort); then
            echo "✓ Layer 2 passed: host and container builds are byte-identical."
            echo "  An independent machine with the pinned toolchain reproduces the same WASM."
          else
            echo "✗ Layer 2 FAILED: host and container outputs differ."
            exit 1
          fi

      # ── Canonical hash manifest ───────────────────────────────────────────
      - name: Produce canonical hash manifest
        run: |
          {
            echo "# StellarCred WASM SHA-256 hashes"
            echo "# Commit:    ${{ github.sha }}"
            echo "# Ref:       ${{ github.ref }}"
            echo "# Workflow:  ${{ github.run_id }}"
            echo "# Toolchain: $(rustc --version)"
            echo "# Verified:  host + 2x container (cross-environment)"
            echo "#"
            awk '{print $1, $2}' build-1/sha256sums.txt
          } > canonical-hashes.txt
          cat canonical-hashes.txt

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-artifacts-${{ github.sha }}
          path: build-1/*.wasm
          retention-days: 30

      - name: Upload canonical hash manifest
        uses: actions/upload-artifact@v7
        with:
          name: wasm-hashes-${{ github.sha }}
          path: canonical-hashes.txt
          retention-days: 90
